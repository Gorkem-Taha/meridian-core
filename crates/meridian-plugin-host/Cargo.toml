[package]
name = "meridian-plugin-host"
description = "The host side of Meridian's plugin protocol: launching a target plugin and driving it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meridian-ast = { path = "../meridian-ast" }
meridian-sdk = { path = "../meridian-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tonic = "0.14"

[dev-dependencies]
meridian-ir = { path = "../meridian-ir" }

[lints]
workspace = true

# A plugin written against the SDK, used only by this crate's tests: it is the
# other end of the boundary for everything the Go plugins do not exercise.
[[bin]]
name = "meridian-target-fake"
path = "fake-plugin/main.rs"
test = false
doc = false
