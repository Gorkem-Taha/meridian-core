# Containers on another machine. A ResourceSet names the host it configures;
# Meridian reaches it over ssh and needs nothing there but Podman.
#
# The host could as well come from the output of an Infrastructure document
# that provisions the machine, with targetHost.from: infrastructure.
apiVersion: meridian/v1
kind: ResourceSet
metadata:
  name: edge-proxy
spec:
  target: podman
  targetHost:
    from: inline
    host: edge01.example.com
  resources:
    - id: proxy-image
      type: image
      params:
        Image: docker.io/library/caddy:2.9

    - id: proxy-config
      type: volume
      params:
        # A volume that is a directory of the host.
        Device: /srv/proxy/config
        Type: none
        Options: bind
      # When the volume's unit changes, the proxy is restarted with it.
      notifies:
        - resource: proxy
          action: restart

    - id: proxy
      type: container
      state: running
      params:
        Image: ${proxy-image}
        ContainerName: proxy
        Volume: ${proxy-config}:/etc/caddy:ro,Z
        PublishPort:
          - "80:80"
          - "443:443"
        AddCapability: NET_BIND_SERVICE
        NoNewPrivileges: true
        unit:
          Description: Reverse proxy on %H
        service:
          Restart: on-failure
          TimeoutStartSec: 300
