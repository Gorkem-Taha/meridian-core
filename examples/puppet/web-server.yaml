# A web server configured with Puppet.
#
# The resources are the abstract types every configuration management target
# takes (package, file, service, user, group, exec), so the same document
# compiles for Ansible or Chef by changing `target`.
apiVersion: meridian/v1
kind: ResourceSet
metadata:
  name: web
spec:
  target: puppet
  targetHost:
    from: inline
    host: web01.example.com
  resources:
    - id: nginx_pkg
      type: package
      params:
        name: nginx

    - id: nginx_conf
      type: file
      params:
        path: /etc/nginx/conf.d/site.conf
        content: |
          server {
            listen 80;
            root /srv/www;
          }
        owner: root
        mode: "0644"
      dependsOn:
        - resource: nginx_pkg
      # Puppet refreshes a service by restarting it; it cannot be told to reload.
      notifies:
        - resource: nginx_svc
          action: restart

    - id: nginx_svc
      type: service
      state: running
      params:
        name: nginx
        enabled: true
      dependsOn:
        - resource: nginx_pkg
