# Monitoring for one machine, deployed to it with Docker Compose.
#
# A ResourceSet names the host it configures. For this target the host is
# where Docker runs: Meridian reaches it over SSH, so nothing but Docker has
# to be installed there. `localhost` means the machine Meridian runs on.
apiVersion: meridian/v1
kind: ResourceSet
metadata:
  name: monitoring
spec:
  target: compose
  targetHost:
    from: inline
    host: metrics01.example.com
  resources:
    - id: metrics
      type: volume

    - id: prometheus_config
      type: config
      params:
        content: |
          scrape_configs:
            - job_name: node
              static_configs:
                - targets: ["exporter:9100"]

    - id: exporter
      type: service
      params:
        image: prom/node-exporter:v1.9.1
        pid: host
        restart: unless-stopped
        volumes: ["/:/host:ro,rslave"]
        command: ["--path.rootfs=/host"]

    - id: prometheus
      type: service
      params:
        image: prom/prometheus:v3.5.0
        restart: unless-stopped
        ports: ["9090:9090"]
        volumes: ["${metrics}:/prometheus"]
        configs:
          - source: ${prometheus_config}
            target: /etc/prometheus/prometheus.yml
        healthcheck:
          test: [CMD, wget, -q, --spider, "http://localhost:9090/-/healthy"]
          interval: 10s
      dependsOn:
        - resource: exporter

    - id: grafana
      type: service
      params:
        image: grafana/grafana:12.1.0
        restart: unless-stopped
        ports: ["3000:3000"]
        environment:
          GF_SECURITY_ADMIN_PASSWORD: $${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      # Prometheus declares a healthcheck, so Grafana waits for it to be healthy.
      dependsOn:
        - resource: prometheus
