# A small shop on one Docker host: a database, an API and a web front end,
# brought up as one Docker Compose project.
#
# Every resource's type is something a Compose file declares, and its params
# are that element's attributes as the Compose specification documents them.
# ${id} is the name of another resource of this document, checked when the
# document compiles. $${NAME} reaches Compose as ${NAME}, one of its own
# variables.
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: shop
spec:
  target: compose
  resources:
    # Not part of the file: how the project itself is brought up.
    - id: deployment
      type: project
      params:
        name: shop-prod
        wait_timeout: 120

    - id: backend
      type: network
      params:
        internal: true

    - id: db_data
      type: volume

    - id: db_password
      type: secret
      params:
        environment: SHOP_DB_PASSWORD

    - id: db
      type: service
      params:
        image: postgres:17
        environment:
          POSTGRES_DB: shop
          POSTGRES_PASSWORD_FILE: /run/secrets/${db_password}
        secrets: ["${db_password}"]
        volumes: ["${db_data}:/var/lib/postgresql/data"]
        networks: ["${backend}"]
        healthcheck:
          test: [CMD-SHELL, pg_isready -U postgres -d shop]
          interval: 5s
          retries: 10

    - id: api
      type: service
      params:
        image: ghcr.io/acme/shop-api:$${SHOP_VERSION:-latest}
        environment:
          DATABASE_URL: postgres://postgres@${db}:5432/shop
        secrets: ["${db_password}"]
        networks: ["${backend}", default]
        restart: unless-stopped
      # db declares a healthcheck, so this waits for it to be healthy.
      dependsOn:
        - resource: db
      # When the API is updated, Compose restarts the web server too.
      notifies:
        - resource: web
          action: restart

    - id: web
      type: service
      params:
        image: nginx:1.27
        environment:
          API_UPSTREAM: http://${api}:8000
        # No host port is named, so Docker picks a free one. The output below
        # reports which.
        ports: ["80"]
      dependsOn:
        - resource: api

  outputs:
    - name: web_url
      value: http://${web.address.80}/
    - name: web_port
      value: ${web.port.80}
    - name: data_volume
      value: ${db_data}
