# An Ubuntu machine image on AWS with nginx baked in, built by Packer.
#
# One document is one Packer build. After the prefix that says what part of
# the build a resource is, its type is Packer's own type and its params are
# that type's arguments. ${id} refers to a variable, a local or a data source
# of this document.
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: web-image
spec:
  target: packer
  resources:
    # The Packer plugin that provides the amazon-ebs builder and the
    # amazon-ami data source. `packer init` installs it.
    - id: amazon
      type: plugin
      params:
        source: github.com/hashicorp/amazon
        version: ">= 1.3.0"

    - id: region
      type: variable
      params:
        type: string
        default: us-east-1

    - id: base
      type: data.amazon-ami
      params:
        region: ${region}
        most_recent: true
        owners: ["099720109477"]
        filters:
          name: ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*
          virtualization-type: hvm

    # formatdate() and timestamp() are Packer's own functions, and are handed
    # over as written.
    - id: stamp
      type: local
      params:
        value: ${formatdate("YYYYMMDDhhmmss", timestamp())}

    - id: ubuntu
      type: source.amazon-ebs
      params:
        region: ${region}
        source_ami: ${base.id}
        instance_type: t3.small
        ssh_username: ubuntu
        ami_name: web-${stamp}
        tags:
          Name: web
          BaseImage: ${base.name}

    # Provisioners run in the order dependsOn gives them.
    - id: wait_for_boot
      type: provisioner.shell
      params:
        inline:
          - cloud-init status --wait

    - id: install_nginx
      type: provisioner.shell
      params:
        # A literal ${ in a script is written $${, here and in every document.
        environment_vars: ["DEBIAN_FRONTEND=noninteractive"]
        inline:
          - sudo apt-get update
          - sudo apt-get install -y nginx
          - echo "built by $${USER} on $(date)" | sudo tee /etc/motd
      dependsOn:
        - resource: wait_for_boot

    - id: site_config
      type: provisioner.file
      params:
        content: "server { listen 80 default_server; root /var/www/html; }\n"
        destination: /tmp/default
      dependsOn:
        - resource: install_nginx

    - id: enable_site
      type: provisioner.shell
      params:
        inline:
          - sudo mv /tmp/default /etc/nginx/sites-available/default
          - sudo systemctl enable nginx
      dependsOn:
        - resource: site_config

  # Packer has no outputs. These are read, after the build, from what the
  # source produced.
  outputs:
    - name: image_id
      value: ${ubuntu.id}
    - name: image_artifact
      value: ${ubuntu.artifact_id}
