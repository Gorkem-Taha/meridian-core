[workspace]
resolver = "2"
members = ["crates/*", "plugins/ansible", "plugins/puppet", "plugins/terraform", "plugins/cloudformation", "plugins/bicep", "plugins/kubernetes", "plugins/docker", "plugins/chef", "plugins/compose"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZanattaMichael/meridian-core"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
