name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: fmt, clippy and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update && rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      # --locked fails the build if Cargo.lock is out of step with the manifests.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  # The same suite on the other systems Meridian is released for. Formatting
  # is checked once, above; clippy runs again here because code behind
  # `cfg(windows)` is only ever compiled on Windows.
  platforms:
    name: clippy and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
