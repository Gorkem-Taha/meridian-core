# A namespace, a ConfigMap and the Deployment that mounts it. Small enough to
# become ready on a one-node test cluster without pulling anything large.
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: workload
spec:
  target: kubernetes
  resources:
    - id: target
      type: cluster
      params:
        namespace: meridian-real

    - id: space
      type: v1/Namespace
      params:
        metadata:
          name: meridian-real

    - id: web_config
      type: v1/ConfigMap
      params:
        data:
          greeting: hello
      dependsOn:
        - resource: space
      notifies:
        - resource: web
          action: restart

    - id: web
      type: apps/v1/Deployment
      params:
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: web
          template:
            metadata:
              labels:
                app: web
            spec:
              containers:
                - name: pause
                  image: registry.k8s.io/pause:3.10
                  volumeMounts:
                    - name: config
                      mountPath: /etc/web
              volumes:
                - name: config
                  configMap:
                    name: ${web_config}
      dependsOn:
        - resource: web_config

  outputs:
    - name: greeting
      value: ${web_config.data.greeting}
    - name: workload
      value: ${web.metadata.namespace}/${web.metadata.name}
    - name: uid
      value: ${web.metadata.uid}
