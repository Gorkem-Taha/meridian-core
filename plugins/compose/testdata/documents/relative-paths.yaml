# Every path here is relative, and the document names no project directory,
# so each compiles with a warning.
apiVersion: meridian/v1
kind: Infrastructure
metadata:
  name: relative
spec:
  target: compose
  resources:
    - id: site
      type: config
      params:
        file: ./nginx.conf
    - id: web
      type: service
      params:
        build:
          context: ./web
          dockerfile: Dockerfile.prod
        env_file:
          - web.env
          - path: ../shared.env
            required: false
        configs: ["${site}"]
        volumes:
          - ./public:/usr/share/nginx/html:ro
          - type: bind
            source: logs
            target: /var/log/nginx
    - id: worker
      type: service
      params:
        build: worker
        env_file: /etc/shop/worker.env
