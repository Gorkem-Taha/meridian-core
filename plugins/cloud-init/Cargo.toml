meridian-plugin-host = { path = "../../crates/meridian-plugin-host" }
meridian-plugin-testkit = { path = "../../crates/meridian-plugin-testkit" }
meridian-target-fake = { path = "../../crates/meridian-target-fake" }

[lints]
workspace = true
